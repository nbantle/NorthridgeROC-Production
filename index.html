<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ROC Production Hub</title>
  <meta name="description" content="Boot up and boot down, automation schedule, recurring tasks and troubleshooting for Northridge Rochester production.">
  <meta name="theme-color" content="#241F20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ROC Production">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Montserrat:wght@500;600;700&display=swap">
  <!-- Load the app's own files fresh every visit, so updates show up right away
       instead of waiting for the browser's cached copy to expire. -->
  <script>window.ROC_V = Date.now();</script>
  <script>document.write('<link rel="stylesheet" href="css/styles.css?v=' + window.ROC_V + '">');</script>
  <noscript><link rel="stylesheet" href="css/styles.css"></noscript>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#home" aria-label="ROC Production Hub home">
        <img src="assets/logo-mark-white.png" alt="" width="34" height="38">
        <span class="brand-text">
          <span class="brand-eyebrow">Northridge Rochester</span>
          <span class="brand-name">Production Hub</span>
        </span>
      </a>
      <nav class="topnav" aria-label="Sections">
        <a href="#boot" data-route="boot">Boot Up/Down</a>
        <a href="#schedule" data-route="schedule">Automation Schedule</a>
        <a href="#edits" data-route="edits">Sunday Edits</a>
        <a href="#tasks" data-route="tasks">Tasks</a>
        <a href="#troubleshooting" data-route="troubleshooting">Troubleshooting</a>
        <a href="#support" data-route="support">Support</a>
      </nav>
    </div>
  </header>

  <main id="view" class="wrap" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#boot" data-route="boot"><i data-lucide="power"></i><span>Boot</span></a>
    <a href="#schedule" data-route="schedule"><i data-lucide="clock"></i><span>Automation</span></a>
    <a href="#edits" data-route="edits"><i data-lucide="clapperboard"></i><span>Edits</span></a>
    <a href="#tasks" data-route="tasks"><i data-lucide="list-checks"></i><span>Tasks</span></a>
    <a href="#troubleshooting" data-route="troubleshooting"><i data-lucide="wrench"></i><span>Fix</span></a>
  </nav>

  <noscript><p class="wrap">This app needs JavaScript turned on.</p></noscript>

  <script src="js/vendor/lucide-0.460.0.min.js"></script>
  <script>
    // Add new data files here, in this list.
    ["data/boot.js", "data/schedule.js", "data/tasks.js", "data/troubleshooting.js",
     "data/support.js", "data/edits.js", "js/app.js"].forEach(function (src) {
      document.write('<script src="' + src + "?v=" + window.ROC_V + '"><\/script>');
    });
  </script>
</body>
</html>
